<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbex</title>
<style>
  :root{--bg:#0B0D12;--surface:#14171F;--text:#F2F4F8;--muted:#A6AEC0;--accent:#7C5CFF;--outline:#39404F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.65}
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 80px}
  h1{font-size:2.4rem;margin:0 0 8px;letter-spacing:-.02em}
  .tag{color:var(--muted);font-size:1.05rem;margin:0 0 40px}
  .card{background:var(--surface);border:1px solid var(--outline);border-radius:16px;
        padding:20px 24px;margin:0 0 14px;display:block;text-decoration:none;color:inherit}
  .card:hover{border-color:var(--accent)}
  .card h2{margin:0 0 4px;font-size:1.1rem}
  .card p{margin:0;color:var(--muted);font-size:.95rem}
  footer{margin-top:48px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--outline);padding-top:24px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rumbex</h1>
  <p class="tag">Decide con tus propios datos.</p>

  <a class="card" href="privacidad.html">
    <h2>Aviso de privacidad</h2>
    <p>Qué datos trata la app y dónde viven.</p>
  </a>
  <a class="card" href="terminos.html">
    <h2>Términos de uso</h2>
    <p>Condiciones del servicio.</p>
  </a>

  <footer>
    Rumbex ofrece estimaciones informativas y no garantiza ingresos. No está afiliado,
    autorizado ni respaldado por Uber, DiDi u otras plataformas.
  </footer>
</div>
</body>
</html>
